<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A.U.R.A — Cinematic AI Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #05060a;
    --surface: #0a0c14;
    --text: #c8cdd8;
    --text-dim: #5a6272;
    --accent: #4a8eff;
    --accent-soft: rgba(74,142,255,0.08);
    --accent-glow: rgba(74,142,255,0.25);
    --violet: #7c6aef;
    --violet-glow: rgba(124,106,239,0.2);
    --cyan: #38bdf8;
    --cyan-glow: rgba(56,189,248,0.15);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ══════════════════════════════════════════════════════════════
     SCENE
     ══════════════════════════════════════════════════════════════ */
  .scene {
    position: relative;
    width: 400px; height: 400px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ══════════════════════════════════════════════════════════════
     CORE CONTAINER — 8 layers stacked
     ══════════════════════════════════════════════════════════════ */
  .aura-core {
    position: relative;
    width: 320px; height: 320px;
  }
  .aura-core svg {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* ── LAYER 1: Plasma Nucleus ── */
  .l-nucleus {
    animation: nucleusBreath 4s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes nucleusBreath {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.04); opacity: 1; }
  }

  /* ── LAYER 2: Energy Halo ── */
  .l-halo {
    animation: haloPulse 5s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes haloPulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.65; transform: scale(1.03); }
  }

  /* ── LAYER 3: Energy Field ── */
  .l-field {
    animation: fieldShift 8s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes fieldShift {
    0%, 100% { transform: rotate(0deg) scale(1); opacity: 0.3; }
    33% { transform: rotate(120deg) scale(1.02); opacity: 0.45; }
    66% { transform: rotate(240deg) scale(0.98); opacity: 0.35; }
  }

  /* ── LAYER 4: Scanning Arcs ── */
  .l-scanning {
    transform-origin: center;
    animation: scanSpin 6s linear infinite;
  }
  @keyframes scanSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .scan-arc {
    animation: arcPulse 3s ease-in-out infinite;
  }
  .scan-arc:nth-child(2) { animation-delay: 1s; }
  .scan-arc:nth-child(3) { animation-delay: 2s; }
  @keyframes arcPulse {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.5; }
  }

  /* ── LAYER 5: Segmented Orbital Rings ── */
  .l-segments {
    transform-origin: center;
    animation: segSpin1 12s linear infinite;
  }
  @keyframes segSpin1 {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .l-segments-2 {
    transform-origin: center;
    animation: segSpin2 16s linear infinite reverse;
  }
  @keyframes segSpin2 {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .seg-stroke {
    stroke-dasharray: 40 8 15 8;
    stroke-linecap: round;
    animation: segDash 20s linear infinite;
  }
  @keyframes segDash {
    to { stroke-dashoffset: -200; }
  }

  /* ── LAYER 6: Broken Mechanical Rings ── */
  .l-mechanical {
    transform-origin: center;
    animation: mechSpin 20s linear infinite;
  }
  @keyframes mechSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .mech-seg {
    stroke-dasharray: 25 5 8 5 15 10;
    stroke-linecap: butt;
    animation: mechDash 30s linear infinite;
  }
  @keyframes mechDash {
    to { stroke-dashoffset: -150; }
  }

  /* ── LAYER 7: Energy Waves ── */
  .l-waves {
    transform-origin: center;
  }
  .wave-ring {
    fill: none;
    stroke: var(--accent);
    stroke-width: 0.5;
    animation: waveExpand 4s ease-out infinite;
    transform-origin: center;
  }
  .wave-ring:nth-child(2) { animation-delay: 1s; }
  .wave-ring:nth-child(3) { animation-delay: 2s; }
  .wave-ring:nth-child(4) { animation-delay: 3s; }
  @keyframes waveExpand {
    0% { transform: scale(0.3); opacity: 0.5; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  /* ── LAYER 8: Floating Particles ── */
  .l-particles {
    transform-origin: center;
    animation: particleFieldSpin 30s linear infinite;
  }
  @keyframes particleFieldSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .float-particle {
    animation: particleFloat 6s ease-in-out infinite alternate;
  }
  @keyframes particleFloat {
    0% { transform: translate(0, 0); opacity: 0.2; }
    50% { opacity: 0.5; }
    100% { transform: translate(var(--dx), var(--dy)); opacity: 0.15; }
  }

  /* ══════════════════════════════════════════════════════════════
     STATE MODIFIERS — change intensity via CSS classes
     ══════════════════════════════════════════════════════════════ */
  /* Idle: default (already defined above) */

  /* Listening */
  .aura-core.state-listening .l-nucleus { animation-duration: 3s; }
  .aura-core.state-listening .l-halo { animation-duration: 3.5s; opacity: 0.6; }
  .aura-core.state-listening .l-field { animation-duration: 6s; }
  .aura-core.state-listening .l-scanning { animation-duration: 4s; }
  .aura-core.state-listening .scan-arc { animation-duration: 2s; }
  .aura-core.state-listening .l-segments { animation-duration: 8s; }
  .aura-core.state-listening .wave-ring { animation-duration: 3s; }

  /* Thinking */
  .aura-core.state-thinking .l-nucleus { animation-duration: 1.5s; }
  .aura-core.state-thinking .l-halo { animation-duration: 2s; opacity: 0.8; }
  .aura-core.state-thinking .l-field { animation-duration: 3s; opacity: 0.5; }
  .aura-core.state-thinking .l-scanning { animation-duration: 2s; }
  .aura-core.state-thinking .scan-arc { animation-duration: 1s; }
  .aura-core.state-thinking .l-segments { animation-duration: 4s; }
  .aura-core.state-thinking .l-segments-2 { animation-duration: 5s; }
  .aura-core.state-thinking .l-mechanical { animation-duration: 6s; }
  .aura-core.state-thinking .wave-ring { animation-duration: 1.5s; }
  .aura-core.state-thinking .l-particles { animation-duration: 15s; }
  .aura-core.state-thinking .float-particle { animation-duration: 3s; }

  /* Responding */
  .aura-core.state-responding .l-nucleus { animation: nucleusPulse 0.8s ease-out 1; }
  .aura-core.state-responding .l-halo { animation: haloFlash 0.6s ease-out 1; }
  .aura-core.state-responding .wave-ring { animation-duration: 1.5s; }
  @keyframes nucleusPulse {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 0.9; }
  }
  @keyframes haloFlash {
    0% { opacity: 0.5; transform: scale(1); }
    30% { opacity: 1; transform: scale(1.15); }
    100% { opacity: 0.4; transform: scale(1); }
  }

  /* ══════════════════════════════════════════════════════════════
     UI CONTROLS
     ══════════════════════════════════════════════════════════════ */
  .controls {
    position: fixed; bottom: 40px;
    display: flex; gap: 10px; z-index: 10;
  }
  .ctrl-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.06em;
    padding: 10px 20px; border-radius: 8px;
    background: var(--surface); border: 1px solid rgba(255,255,255,0.06);
    color: var(--text-dim); cursor: pointer;
    transition: all 0.25s ease;
    text-transform: uppercase;
  }
  .ctrl-btn:hover {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft);
  }
  .ctrl-btn.active {
    border-color: var(--accent); color: #fff;
    background: rgba(74,142,255,0.15);
    box-shadow: 0 0 20px rgba(74,142,255,0.1);
  }

  .state-label {
    position: fixed; top: 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 0.1em;
    color: var(--text-dim); text-transform: uppercase;
    transition: color 0.4s ease;
  }
  .state-label span {
    display: inline-block;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    margin-right: 10px; vertical-align: middle;
    animation: dotBlink 2s ease-in-out infinite;
  }
  @keyframes dotBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ══════════════════════════════════════════════════════════════
     AMBIENT BACKGROUND
     ══════════════════════════════════════════════════════════════ */
  .ambient {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 600px 400px at 50% 45%, rgba(74,142,255,0.04), transparent 70%),
      radial-gradient(ellipse 400px 300px at 50% 50%, rgba(124,106,239,0.02), transparent 60%),
      var(--bg);
  }

  /* Grid (very subtle) */
  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    opacity: 0.015;
    background-image:
      linear-gradient(rgba(74,142,255,0.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,142,255,0.4) 1px, transparent 1px);
    background-size: 80px 80px;
  }
</style>
</head>
<body>

<div class="ambient"></div>
<div class="grid-bg"></div>

<div class="state-label" id="stateLabel"><span></span>IDLE</div>

<div class="scene">
  <div class="aura-core" id="auraCore">

    <!-- ═══ LAYER 1: PLASMA NUCLEUS ═══ -->
    <svg viewBox="0 0 320 320" class="l-nucleus">
      <defs>
        <radialGradient id="nucleusGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
          <stop offset="20%" stop-color="#8cc4ff" stop-opacity="0.9"/>
          <stop offset="50%" stop-color="#4a8eff" stop-opacity="0.6"/>
          <stop offset="80%" stop-color="#2563eb" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="nucleusInner" cx="40%" cy="40%" r="50%">
          <stop offset="0%" stop-color="#fff" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#4a8eff" stop-opacity="0"/>
        </radialGradient>
        <filter id="nucleusBlur">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
        </filter>
      </defs>
      <circle cx="160" cy="160" r="32" fill="url(#nucleusGrad)" filter="url(#nucleusBlur)"/>
      <circle cx="160" cy="160" r="18" fill="url(#nucleusInner)"/>
      <!-- Plasma tendrils -->
      <g opacity="0.4">
        <ellipse cx="160" cy="160" rx="28" ry="10" fill="none" stroke="#8cc4ff" stroke-width="0.6" transform="rotate(0 160 160)">
          <animateTransform attributeName="transform" type="rotate" values="0 160 160;360 160 160" dur="8s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="160" cy="160" rx="22" ry="14" fill="none" stroke="#6ea8ff" stroke-width="0.5" transform="rotate(60 160 160)">
          <animateTransform attributeName="transform" type="rotate" values="60 160 160;420 160 160" dur="10s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="160" cy="160" rx="30" ry="8" fill="none" stroke="#a78bfa" stroke-width="0.4" transform="rotate(120 160 160)">
          <animateTransform attributeName="transform" type="rotate" values="120 160 160;-240 160 160" dur="12s" repeatCount="indefinite"/>
        </ellipse>
      </g>
    </svg>

    <!-- ═══ LAYER 2: ENERGY HALO ═══ -->
    <svg viewBox="0 0 320 320" class="l-halo">
      <defs>
        <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#4a8eff" stop-opacity="0.12"/>
          <stop offset="40%" stop-color="#4a8eff" stop-opacity="0.06"/>
          <stop offset="70%" stop-color="#7c6aef" stop-opacity="0.03"/>
          <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
        </radialGradient>
        <filter id="haloBlur">
          <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
        </filter>
      </defs>
      <circle cx="160" cy="160" r="65" fill="url(#haloGrad)" filter="url(#haloBlur)"/>
    </svg>

    <!-- ═══ LAYER 3: ENERGY FIELD ═══ -->
    <svg viewBox="0 0 320 320" class="l-field">
      <defs>
        <linearGradient id="fieldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4a8eff" stop-opacity="0.08"/>
          <stop offset="100%" stop-color="#7c6aef" stop-opacity="0.02"/>
        </linearGradient>
        <linearGradient id="fieldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.06"/>
          <stop offset="100%" stop-color="#4a8eff" stop-opacity="0.01"/>
        </linearGradient>
        <filter id="fieldBlur">
          <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
        </filter>
      </defs>
      <!-- Irregular aurora shapes -->
      <path d="M160 80 Q220 100 200 160 Q240 200 160 240 Q80 200 120 160 Q100 100 160 80Z"
            fill="url(#fieldGrad1)" filter="url(#fieldBlur)">
        <animateTransform attributeName="transform" type="rotate" values="0 160 160;360 160 160" dur="24s" repeatCount="indefinite"/>
      </path>
      <path d="M160 90 Q210 120 190 160 Q220 210 160 230 Q100 210 130 160 Q110 120 160 90Z"
            fill="url(#fieldGrad2)" filter="url(#fieldBlur)">
        <animateTransform attributeName="transform" type="rotate" values="360 160 160;0 160 160" dur="18s" repeatCount="indefinite"/>
      </path>
    </svg>

    <!-- ═══ LAYER 4: SCANNING ARCS ═══ -->
    <svg viewBox="0 0 320 320" class="l-scanning">
      <defs>
        <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#4a8eff" stop-opacity="0"/>
          <stop offset="50%" stop-color="#4a8eff" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#4a8eff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- Arc 1 -->
      <path class="scan-arc" d="M160 80 A80 80 0 0 1 226 116" fill="none" stroke="url(#scanGrad)" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Arc 2 -->
      <path class="scan-arc" d="M240 160 A80 80 0 0 1 200 232" fill="none" stroke="url(#scanGrad)" stroke-width="1" stroke-linecap="round"/>
      <!-- Arc 3 -->
      <path class="scan-arc" d="M100 240 A80 80 0 0 1 80 160" fill="none" stroke="url(#scanGrad)" stroke-width="0.8" stroke-linecap="round"/>
    </svg>

    <!-- ═══ LAYER 5: SEGMENTED ORBITAL RINGS ═══ -->
    <svg viewBox="0 0 320 320" class="l-segments">
      <circle cx="160" cy="160" r="105" fill="none" stroke="#4a8eff" stroke-width="0.6" class="seg-stroke" opacity="0.3"/>
    </svg>
    <svg viewBox="0 0 320 320" class="l-segments-2">
      <circle cx="160" cy="160" r="115" fill="none" stroke="#7c6aef" stroke-width="0.5" class="seg-stroke" opacity="0.2"/>
    </svg>

    <!-- ═══ LAYER 6: BROKEN MECHANICAL RINGS ═══ -->
    <svg viewBox="0 0 320 320" class="l-mechanical">
      <circle cx="160" cy="160" r="125" fill="none" stroke="#38bdf8" stroke-width="0.4" class="mech-seg" opacity="0.15"/>
      <circle cx="160" cy="160" r="95" fill="none" stroke="#4a8eff" stroke-width="0.3" class="mech-seg" opacity="0.12" stroke-dasharray="18 6 10 8 25 5"/>
    </svg>

    <!-- ═══ LAYER 7: ENERGY WAVES ═══ -->
    <svg viewBox="0 0 320 320" class="l-waves">
      <circle class="wave-ring" cx="160" cy="160" r="50"/>
      <circle class="wave-ring" cx="160" cy="160" r="50"/>
      <circle class="wave-ring" cx="160" cy="160" r="50"/>
      <circle class="wave-ring" cx="160" cy="160" r="50"/>
    </svg>

    <!-- ═══ LAYER 8: FLOATING PARTICLES ═══ -->
    <svg viewBox="0 0 320 320" class="l-particles" id="particleLayer"></svg>

  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button class="ctrl-btn active" data-state="idle" onclick="setState('idle')">Idle</button>
  <button class="ctrl-btn" data-state="listening" onclick="setState('listening')">Listening</button>
  <button class="ctrl-btn" data-state="thinking" onclick="setState('thinking')">Thinking</button>
  <button class="ctrl-btn" data-state="responding" onclick="setState('responding')">Responding</button>
</div>

<script>
(function() {
  const core = document.getElementById('auraCore');
  const label = document.getElementById('stateLabel');
  const btns = document.querySelectorAll('.ctrl-btn');
  const particleLayer = document.getElementById('particleLayer');

  const stateNames = {
    idle: 'IDLE',
    listening: 'LISTENING',
    thinking: 'THINKING',
    responding: 'RESPONDING'
  };

  // Generate floating particles
  function initParticles() {
    const count = 18;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count;
      const dist = 100 + Math.random() * 50;
      const x = 160 + Math.cos(angle) * dist;
      const y = 160 + Math.sin(angle) * dist;
      const size = 1 + Math.random() * 2;
      const dx = (Math.random() - 0.5) * 30;
      const dy = (Math.random() - 0.5) * 30;
      const dur = 5 + Math.random() * 6;
      const delay = Math.random() * 5;

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', x);
      circle.setAttribute('cy', y);
      circle.setAttribute('r', size);
      circle.setAttribute('fill', '#4a8eff');
      circle.setAttribute('opacity', '0.25');
      circle.classList.add('float-particle');
      circle.style.cssText = `--dx:${dx}px;--dy:${dy}px;animation-duration:${dur}s;animation-delay:${delay}s;`;
      particleLayer.appendChild(circle);
    }
  }

  // State management
  window.setState = function(state) {
    // Remove all state classes
    core.className = 'aura-core';
    if (state !== 'idle') core.classList.add('state-' + state);

    // Update button active state
    btns.forEach(b => b.classList.toggle('active', b.dataset.state === state));

    // Update label
    label.innerHTML = '<span></span>' + stateNames[state];

    // For responding, auto-return to idle
    if (state === 'responding') {
      setTimeout(() => setState('idle'), 1200);
    }
  };

  initParticles();
})();
</script>

</body>
</html>

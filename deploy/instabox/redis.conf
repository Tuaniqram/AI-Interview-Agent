# Redis for the AURA backend. The password is passed by aura-redis.service, never written here.
bind 127.0.0.1
port 6379
daemonize no

# Survive a restart: sessions, queued report jobs, budgets.
appendonly yes
appendfsync everysec

# Never throw a live interview away to make room: writes fail instead (the app then falls back to
# Postgres). Every key except a session has a TTL, and sessions expire after 24 h.
# The policy applies to the whole instance, so do not share it with a pure cache that needs eviction.
maxmemory 256mb
maxmemory-policy noeviction

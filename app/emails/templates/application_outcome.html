<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" role="presentation">
  <tr>
    <td align="center" style="padding:48px 16px">
      <table width="480" cellpadding="0" cellspacing="0" role="presentation" style="max-width:480px;width:100%">
        <tr>
          <td align="center" style="padding-bottom:32px">
            <img src="${APP_URL}/favicon.svg" width="40" height="40" alt="AI Interview Agent" style="display:block;border:0" />
          </td>
        </tr>
        <tr>
          <td style="background:#ffffff;border-radius:12px;padding:40px 32px;box-shadow:0 1px 2px rgba(0,0,0,0.06),0 1px 3px rgba(0,0,0,0.04)">

            <h1 style="font-size:20px;font-weight:600;color:#1a1a2e;margin:0 0 8px;text-align:center">${HEADLINE}</h1>
            <p style="font-size:15px;color:#5b6778;line-height:1.5;margin:0;text-align:center">
              Hi <strong style="color:#1a1a2e">${CANDIDATE_NAME}</strong>, ${MESSAGE}
              (<strong style="color:#1a1a2e">${JOB_ROLE}</strong> at <strong style="color:#1a1a2e">${ORG_NAME}</strong>).
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 16px 0">
            <p style="font-size:12px;color:#9aa0a6;margin:0;line-height:1.4">
              AI Interview Agent &mdash; AI-powered interview practice and evaluation
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>

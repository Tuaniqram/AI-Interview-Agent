# Render Blueprint for the AI Interview Agent backend (branch: prod, which also carries the frontend for Vercel).
#
# Secrets are NOT stored here. Every `sync: false` variable is asked for in the Render dashboard when the
# Blueprint is created. Fill them from your own .env (see .env.example for what each one is).

services:
  - type: web
    name: ai-interview-agent
    runtime: python
    branch: prod
    autoDeploy: true

    # prod carries the frontend too (Vercel builds that). Redeploy this service only when backend files change.
    buildFilter:
      paths:
        - app/**
        - prompts/**
        - alembic/**
        - alembic.ini
        - requirements.txt
        - runtime.txt

    # Render has no Mumbai region; Singapore is the closest to the Mumbai database.
    region: singapore

    # The app imports sentence-transformers (PyTorch) and warms an embedding model at startup, which needs
    # roughly 2 GB of RAM. As far as I know that is Render's "standard" plan. A smaller plan (or "free") is
    # cheaper but is likely to be killed for running out of memory. Change it here if you want to try one.
    plan: standard

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      # ---- fixed values (safe to keep in git) ----
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: TRUSTED_PROXY_COUNT   # Render puts one proxy in front of the app (rate limiter reads the real client)
        value: "1"
      - key: DEMO_TOOLS_ENABLED    # never enable on a deployed instance
        value: "false"
      - key: SESSION_STORE_BACKEND # falls back to in-process memory if REDIS_URL is empty or unreachable
        value: redis

      # ---- generated by Render ----
      - key: SECRET_KEY            # signs every login/interview token; the app refuses the dev default when deployed
        generateValue: true

      # ---- you provide these in the dashboard ----
      - key: DATABASE_URL          # Supabase pooler URL (Session or Transaction pooler), Mumbai project
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY  # resume storage; leave empty if you do not use it
        sync: false
      - key: APP_URL               # the public URL of your FRONTEND, e.g. https://your-app.example.com (not localhost)
        sync: false
      - key: CORS_ORIGINS          # the same frontend origin(s), comma separated
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: REDIS_URL             # Upstash: rediss://default:<token>@<name>.upstash.io:6379
        sync: false
      - key: RESEND_API_KEY        # email; leave empty if you do not send mail yet
        sync: false

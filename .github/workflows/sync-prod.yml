name: Sync prod

# `prod` is the deploy branch for BOTH halves: Render builds the backend from it and Vercel builds the frontend from it.
# After CI passes on `main`, copy the deploy files (backend + frontend) from main into prod; the push to prod is what
# redeploys them. Copying (not merging) keeps prod free of the tests, docs and tools.
# Run it by hand from the Actions tab (workflow_dispatch) to deploy main's current state without a new commit.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-prod
  cancel-in-progress: false

jobs:
  sync:
    name: Copy deploy files from main to prod
    runs-on: ubuntu-latest
    # Only for a successful CI run of a push to main (never for pull requests), or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          path: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: prod
          path: prod

      - name: Copy deploy files
        run: bash main/scripts/sync_prod.sh main prod

      - name: Commit and push to prod
        id: push
        working-directory: prod
        run: |
          if git diff --cached --quiet; then
            echo "Nothing to deploy."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="$(git -C ../main rev-parse --short HEAD)"
          subject="$(git -C ../main log -1 --format=%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "deploy: sync from main@${sha}" -m "${subject}"
          git push origin prod
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with the built-in token does not start other workflows, so a `push: [prod]` workflow would never run
      # after this sync. The instabox deploy therefore runs here, right after prod is updated (needs the INSTABOX_API_KEY
      # repository secret; the host's ~/AI-Interview-Agent/deploy.sh does the pull, install, migrate and restart).
      - name: Deploy to instabox
        if: steps.push.outputs.pushed == 'true'
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          if [ -z "$INSTABOX_API_KEY" ]; then
            echo "INSTABOX_API_KEY is not set; skipping the instabox deploy."
            exit 0
          fi
          curl -fsSL https://api.instabox.sh/install.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.instabox/bin:$PATH"
          # deploy.sh (pip install, frontend build, restart, health checks) outlasts one `instabox exec` call, which was
          # killed with exit 124 while the deploy itself was fine. So: start it detached on the host (it writes the exit
          # code to its log), then poll with short calls until it reports the commit we pushed, or fails, or times out.
          expected="$(git -C prod rev-parse --short HEAD)"
          log='~/deploy.log'
          instabox exec aura -- bash -lc "rm -f $log; setsid nohup bash -c '(flock -n 9 || { echo \"another deploy is running\"; exit 75; }; ~/AI-Interview-Agent/deploy.sh) 9>~/deploy.lock; echo \"DEPLOY_EXIT:\$?\"' > $log 2>&1 < /dev/null & echo started"
          for i in $(seq 1 60); do
            sleep 15
            out="$(instabox exec aura -- bash -lc "tail -n 40 $log 2>/dev/null" || true)"
            if echo "$out" | grep -q "^DEPLOY_EXIT:0"; then
              echo "$out" | tail -n 5
              if echo "$out" | grep -q "Deployed $expected"; then
                echo "instabox is running $expected"
                exit 0
              fi
              echo "Deploy finished but did not report $expected"
              exit 1
            fi
            if echo "$out" | grep -q "^DEPLOY_EXIT:"; then
              echo "$out"
              echo "instabox deploy failed"
              exit 1
            fi
          done
          echo "instabox deploy did not finish within 15 minutes"
          instabox exec aura -- bash -lc "tail -n 40 $log" || true
          exit 1

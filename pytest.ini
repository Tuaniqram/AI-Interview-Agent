[pytest]
asyncio_mode = auto
addopts = --ignore=tests/backend --ignore=scripts -m "not integration and not e2e and not llm"
markers =
    unit: pure unit tests, no I/O, no external services (default)
    contract: cross-module invariants, no external services (default)
    integration: needs live services (DB and/or server), self-skips when unavailable
    db: needs a PostgreSQL DATABASE_URL (or a local test DB)
    llm: needs a working LLM provider/API key
    e2e: full flow against a running server (opt-in, not in default runs)
